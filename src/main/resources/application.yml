spring:
  application:
    name: incident-room-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true

server:
  shutdown: graceful
  error:
    include-message: never   # never leak internal exception messages to clients — GlobalExceptionHandler owns response shape
    include-stacktrace: never

app:
  frontend-base-url: ${FRONTEND_BASE_URL}
  cookie:
    domain: ${COOKIE_DOMAIN}
    secure: ${COOKIE_SECURE}     # true in prod (HTTPS-only); overridden in application-prod.yml
  jwt:
    # Deliberately NO default here — a missing JWT_SECRET must fail startup rather than boot with
    # a weak/shared signing key. The "local" profile (application-local.yml) supplies its own
    # dev-only fallback that overrides this; every other profile (including "prod") inherits this
    # entry as-is and will fail to start if JWT_SECRET isn't set in the environment.
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  email:
    resend-api-key: ${RESEND_API_KEY}
    from-address: ${EMAIL_FROM_ADDRESS:noreply@incidentroom.com}
    brevo:
      # See BrevoEmailService — the active "prod" email provider. sender-address must be a Brevo
      # single-sender-verified address (Settings > Senders, Domains & Dedicated IPs > Senders);
      # no domain ownership required, just a click-through confirmation email.
      api-key: ${BREVO_API_KEY}
      sender-address: ${BREVO_SENDER_ADDRESS}
      sender-name: ${BREVO_SENDER_NAME:Incident Room}
    gmail-api:
      # See GmailApiEmailService — sends Gmail mail over HTTPS (Gmail API) instead of raw SMTP,
      # since many hosts (e.g. Railway's Free/Trial/Hobby plans) block outbound SMTP ports.
      # client-id/secret reuse the same Google OAuth app already used for user login
      # (GOOGLE_OAUTH_CLIENT_ID/SECRET); refresh-token is a separate, long-lived credential
      # obtained once out-of-band by granting the gmail.send scope to the sending account.
      client-id: ${GOOGLE_OAUTH_CLIENT_ID}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
      refresh-token: ${GMAIL_REFRESH_TOKEN}
      sender-address: ${GMAIL_SENDER_ADDRESS}
  email-verification:
    code-ttl-minutes: 10
    max-attempts: 5
    resend-cooldown-minutes: 1

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      # Without this, Spring Boot's default "authorized" check for when-authorized is just
      # "is there any authenticated principal" — meaning any logged-in player (not just admins)
      # would see the health breakdown (component names, Mongo status, etc). Restricting to
      # ADMIN keeps this consistent with the rest of the app's admin-only operational-visibility
      # posture (see SecurityConfig's /actuator/** rule, which also requires ROLE_ADMIN for
      # everything except the bare health/info status). Role name has no "ROLE_" prefix here —
      # Boot's isUserInRole() check adds it, matching how JwtAuthenticationFilter grants
      # "ROLE_ADMIN" and how SecurityConfig's own .hasRole("ADMIN") calls are written.
      roles: ADMIN
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs